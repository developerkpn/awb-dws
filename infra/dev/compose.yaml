# Local development databases only (npm run db:up / db:down).
# Production: prereg → PostgreSQL on AWS; site → SQL Server, one per plant.
name: awb-dws-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: awb
      POSTGRES_PASSWORD: awb_dev_password
      POSTGRES_DB: awb_prereg
    ports:
      # Host port 5450: 5432-5445 are used by other local project databases.
      - '127.0.0.1:5450:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U awb -d awb_prereg']
      interval: 5s
      timeout: 5s
      retries: 20

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: AwbDev_Passw0rd
    ports:
      - '127.0.0.1:1433:1433'
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q ''SELECT 1'' -b -o /dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

# Never let Docker pick 172.x here: the office network uses 172.22.0.0/16
# and an automatic bridge on it hijacks the route to internal servers.
networks:
  default:
    ipam:
      config:
        - subnet: 192.168.243.0/24

volumes:
  postgres-data:
  sqlserver-data:
